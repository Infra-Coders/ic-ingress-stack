apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 10m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.10.0
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
  values:
    controller:
      service:
        type: LoadBalancer
        annotations:
          # Use NLB (Network Load Balancer) instead of CLB
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
          # Enable cross-zone load balancing
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

        # Use Cluster mode to register all nodes as targets
        externalTrafficPolicy: Cluster

      # Enable real IP forwarding
      config:
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"

      # Enable SSL passthrough for apps that handle TLS themselves
      extraArgs:
        enable-ssl-passthrough: true

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # Metrics for monitoring
      metrics:
        enabled: true

      # Run on worker nodes only
      nodeSelector:
        kubernetes.io/role: worker